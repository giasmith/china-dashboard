# Data validation + unit tests (+ browser smoke test). Runs on pull requests, and is reused by the deploy workflow.
name: Validate

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate data files (schemas + cross-file checks)
        run: python scripts/validate_data.py

      - name: Python tests
        run: python -m unittest discover -s tests/py -v

      - name: Pipeline tests
        run: python -m unittest discover -s pipeline/tests -v

      - name: JavaScript syntax / import check
        run: node scripts/check_js.mjs

      - name: JavaScript unit tests
        run: node --test

      - name: Browser smoke test
        run: |
          python -m playwright install --with-deps chromium
          python -m http.server 8000 --directory site &
          sleep 2
          python tests/browser/smoke.py
